[package]
name = "map_reduce"
version = "1.0.0"
edition = "2024"
authors = ["CS 162 Staff <cs162@eecs.berkeley.edu>"]

[dependencies]
tonic = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.4"
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.20", features = ["codec"] }

async-stream = "0.3.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rand = "0.10.3"
log = "0.4.28"
env_logger = "0.11.11"
bincode = "1.3.3"
futures = "0.3.31"
bytes = "1.10.1"

clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.100"
thiserror = "2.0.21"
fnv = "1.0.7"
itertools = "0.15.0"
tempfile = "3.23.0"

uuid = { version = "1.29.0", features = ["v4"] }
rand_chacha = { version = "0.10.0", optional = true }

[build-dependencies]
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.3.0"

[features]
default = []
# Enabled when code is compiled on the autograder
autograder = ["dep:rand_chacha"]

[[bin]]
name = "mr-coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "mr-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "mr-client"
path = "src/bin/client.rs"

[[bin]]
name = "mr-autograder"
path = "src/bin/autograder.rs"
