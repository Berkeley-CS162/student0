[package]
name = "lab_grpc"
version = "1.0.0"
edition = "2024"

[dependencies]
tonic = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.4"
futures-core = "0.3.34"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"

async-stream = "0.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.3"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
protoc-bin-vendored = "3.3.0"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
